    <!--
      GitHub Pages deep links: public/404.html turns /hi-im-franco/work into /hi-im-franco/?/work.
      This restores the real path before React Router reads it (spa-github-pages technique).
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <noscript>Franco Miguel Valencia: data scientist and applied researcher. This site needs JavaScript for its interactive instrument.</noscript>

  </body>
