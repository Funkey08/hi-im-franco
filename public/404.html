<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Franco Miguel Valencia</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a refresh on /hi-im-franco/work).
      It redirects to the app root with the path in the query string; index.html restores it.
      pathSegmentsToKeep = 1 keeps the "/hi-im-franco" project prefix.
      Technique: https://github.com/rafgraph/spa-github-pages (MIT).
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
